<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#130f2e"><title>Mates 2º ESO</title>
<style>
:root{--bg:#130f2e;--c:#1e1848;--c2:#2c2466;--tx:#f6f3ff;--mu:#aaa4d8;--p:#ff4fa3;--a:#7c5cff;--g:#37e8ae;--r:#ff6b78;--y:#ffd45e;--ff:ui-rounded,"SF Pro Rounded",Nunito,"Trebuchet MS",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at 15% -5%,#3a1f8f,transparent 45%),radial-gradient(circle at 100% 30%,#6b1b5e55,transparent 40%),var(--bg);background-attachment:fixed;color:var(--tx);font:16px/1.5 var(--ff);padding:env(safe-area-inset-top) 0 96px}
.w{max-width:640px;margin:auto;padding:14px 16px}
h1{font-size:30px;margin:8px 0 0;letter-spacing:-.5px}h1 span{background:linear-gradient(90deg,var(--p),var(--y));-webkit-background-clip:text;background-clip:text;color:transparent}
h2,h3{margin:4px 0 8px}.sub{color:var(--mu);margin:0 0 12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chip{flex:none;border:0;border-radius:99px;padding:10px 16px;background:var(--c);color:var(--tx);font:700 15px var(--ff)}
.chip.on{background:linear-gradient(135deg,var(--p),var(--a));box-shadow:0 4px 16px #ff4fa355}
.card{background:var(--c);border-radius:22px;padding:16px;margin:12px 0;border:1px solid #ffffff12}
.b{border:0;border-radius:16px;padding:13px 18px;font:800 16px var(--ff);color:#fff;background:linear-gradient(135deg,var(--p),var(--a))}
.b.g{background:var(--c2)}.b:active,.chip:active{transform:scale(.97)}
input[type=text]{width:100%;padding:14px;border-radius:16px;border:2px solid var(--c2);background:var(--bg);color:var(--tx);font:700 22px var(--ff);text-align:center}
input[type=text]:focus{outline:0;border-color:var(--p)}
input[type=range]{width:100%;accent-color:var(--p);margin:6px 0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#130f2eee;backdrop-filter:blur(12px);padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-top:1px solid #ffffff14}
nav button{flex:1;border:0;background:0;color:var(--mu);font:700 11px var(--ff);padding:4px}
nav button b{display:block;font-size:22px}nav .on{color:var(--tx)}nav .on b{filter:drop-shadow(0 0 8px var(--p))}
.q{font-size:24px;text-align:center;margin:14px 0;font-weight:800}small{color:var(--mu)}
.f{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px;line-height:1.2}
.f i{font-style:normal;padding:0 5px}.f i:first-child{border-bottom:2px solid currentColor}
.ok{color:var(--g)}.ko{color:var(--r)}
.bar{height:12px;border-radius:9px;background:var(--c2);overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--y))}
.st{background:var(--bg);border-radius:16px;padding:8px 14px;margin-top:12px}.st p{margin:6px 0}
.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}.kb{display:flex;gap:8px;margin-top:8px;justify-content:center}.kb .b{padding:8px 22px}
.cell{flex:1;height:26px;border-radius:5px;background:var(--c2)}.cell.on{background:var(--p)}
.dt{display:block;width:12px;height:12px;border-radius:4px;background:var(--a)}.dt.x{background:var(--p)}
details summary{cursor:pointer;font-weight:700}p{margin:8px 0}
</style></head><body><div class="w"><h1>Mates <span>2º ESO</span></h1><p class="sub">Entiende, practica y demuestra lo que sabes.</p><div id="v"></div></div>
<nav id="nv"></nav>
<script>
const $=s=>document.querySelector(s),R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,P=a=>a[R(0,a.length-1)],A=Math.abs;
const gcd=(a,b)=>b?gcd(b,a%b):A(a),lcm=(a,b)=>a/gcd(a,b)*b;
const sg=n=>n<0?'−'+A(n):''+n,pn=n=>n<0?'('+sg(n)+')':''+n,SUP=(a,e)=>a+'<sup>'+e+'</sup>';
const F=(n,d)=>`<span class="f"><i>${sg(n)}</i><i>${d}</i></span>`;
const red=(n,d)=>{const g=gcd(n,d)||1;n/=g;d/=g;if(d<0){n=-n;d=-d}return[n,d]};
const cf=(n,d)=>{[n,d]=red(n,d);return d==1?''+n:n+'/'+d},FS=(n,d)=>{[n,d]=red(n,d);return d==1?sg(n):F(n,d)};
const TOP={ent:['Enteros','➕'],fra:['Fracciones','🍕'],pot:['Potencias','⚡'],rai:['Raíces','🌱']};
let DB;try{DB=JSON.parse(localStorage.getItem('m2eso'))}catch(e){}DB=DB||{st:{},er:{},ex:[]};
const save=()=>{try{localStorage.setItem('m2eso',JSON.stringify(DB))}catch(e){}};
const rec=(g,ok)=>{const s=DB.st[g.t]=DB.st[g.t]||{o:0,n:0};s.n++;if(ok)s.o++;else DB.er[g.k]=(DB.er[g.k]||0)+1;save()};
const SG=[-9,-8,-7,-6,-5,-4,-3,-2,2,3,4,5,6,7,8,9],D=[2,3,4,5,6,8,9,10,12];
const G={
ent:[()=>{let t,n=R(4,5);do{t=[];for(let i=0;i<n;i++)t.push((R(0,1)?1:-1)*R(1,15))}while(!(t.some(x=>x>0)&&t.some(x=>x<0)));
 const q=sg(t[0])+t.slice(1).map(x=>(x<0?' − ':' + ')+A(x)).join(''),p=t.filter(x=>x>0).reduce((a,b)=>a+b,0),m=t.filter(x=>x<0).reduce((a,b)=>a+b,0),r=p+m;
 return{k:'Sumas y restas de enteros',q,a:''+r,s:[`Suma los positivos: <b>${p}</b>`,`Suma los negativos: <b>${sg(m)}</b>`,`${p} ${m<0?'−':'+'} ${A(m)} = <b>${sg(r)}</b>`],h:v=>v==p-m?'Parece que sumaste todo sin tener en cuenta los signos.':v==-r?'Ojo con el signo final: gana el signo del grupo que suma más.':0}},
()=>{const d=R(0,1),b=P(SG),c=P(SG),a=b*c,r=d?c:a,ds=d?(a<0)!=(b<0):(b<0)!=(c<0);
 return{k:'Regla de los signos',q:d?`${pn(a)} : ${pn(b)}`:`${pn(b)} · ${pn(c)}`,a:''+r,s:[`Signos ${ds?'distintos → el resultado es <b>negativo</b>':'iguales → el resultado es <b>positivo</b>'}`,d?`${A(a)} : ${A(b)} = ${A(r)}`:`${A(b)} · ${A(c)} = ${A(r)}`,`Resultado: <b>${sg(r)}</b>`],h:v=>v==-r?'Signos iguales dan +, signos distintos dan −.':0}},
()=>{const a=R(1,15),b=R(1,15),c=R(1,15),r=a-b+c;
 return{k:'Paréntesis con signo menos',q:`${a} − (${b} − ${c})`,a:''+r,s:[`Un − delante del paréntesis cambia el signo de todo lo de dentro`,`${a} − ${b} + ${c}`,`= <b>${sg(r)}</b>`],h:v=>v==a-b-c?'Al quitar un paréntesis precedido de −, cambian los signos de dentro: −c pasa a +c.':0}}],
fra:[()=>{let b,d,a,c,o,n,m;do{b=P(D);d=P(D.filter(x=>x!=b));a=R(1,b-1);c=R(1,d-1);o=R(0,1)?1:-1;m=lcm(b,d);n=a*m/b+o*c*m/d}while(!n);
 return{k:'Suma de fracciones',q:`${F(a,b)} ${o>0?'+':'−'} ${F(c,d)}`,a:cf(n,m),s:[`m.c.m.(${b}, ${d}) = <b>${m}</b>`,`Mismo denominador: ${F(a*m/b,m)} ${o>0?'+':'−'} ${F(c*m/d,m)}`,`Operamos los numeradores: ${F(n,m)}`,`Simplificamos: <b>${FS(n,m)}</b>`],h:v=>A(v-(a+o*c)/(b+d))<1e-9?'No se suman los denominadores. Primero busca el m.c.m. y ponlas con el mismo denominador.':0}},
()=>{const L=[2,3,4,5,6,7,8],b=P(L),d=P(L),a=R(1,7),c=R(1,7),o=R(0,1),n=o?a*d:a*c,m=o?b*c:b*d;
 return{k:'Producto y división de fracciones',q:`${F(a,b)} ${o?':':'·'} ${F(c,d)}`,a:cf(n,m),s:o?[`Dividir es multiplicar por la inversa: ${F(a,b)} · ${F(d,c)}`,`Arriba con arriba, abajo con abajo: ${F(n,m)}`,`Simplificamos: <b>${FS(n,m)}</b>`]:[`Arriba con arriba, abajo con abajo: ${F(n,m)}`,`Simplificamos: <b>${FS(n,m)}</b>`],h:v=>o&&A(v-(a*c)/(b*d))<1e-9?'En la división no se multiplica directamente: hay que invertir la segunda fracción.':0}},
()=>{const d=P([3,4,5,6,8]),a=R(1,d-1),N=d*R(2,12),u=N/d;
 return{k:'Fracción de un número',q:`${F(a,d)} de ${N}`,a:''+u*a,s:[`Divide entre el denominador: ${N} : ${d} = ${u}`,`Multiplica por el numerador: ${u} · ${a} = <b>${u*a}</b>`]}},
()=>{let a,b,k=R(2,7);do{b=R(2,9);a=R(1,12)}while(gcd(a,b)!=1||a==b);
 return{k:'Simplificar fracciones',q:`Simplifica ${F(a*k,b*k)}`,a:cf(a,b),s:[`m.c.d.(${a*k}, ${b*k}) = <b>${k}</b>`,`Dividimos arriba y abajo entre ${k}: <b>${F(a,b)}</b>`]}}],
pot:[()=>{const a=R(2,5),n=R(2,5),r=(-a)**n;
 return{k:'Signo de una potencia',q:`(−${a})<sup>${n}</sup>`,a:''+r,s:[`${Array(n).fill(pn(-a)).join(' · ')}`,`Exponente ${n%2?'impar → negativo':'par → positivo'}`,`Valor: <b>${sg(r)}</b>`],h:v=>v==-r?'Exponente par → positivo; impar → negativo.':0}},
()=>{const a=R(2,6),n=P([2,4]),r=-(a**n);
 return{k:'Paréntesis en potencias',q:`−${a}<sup>${n}</sup>`,a:''+r,s:[`Sin paréntesis, el exponente solo afecta a ${a}; el − se queda fuera`,`${a}<sup>${n}</sup> = ${a**n}`,`Con el signo: <b>${sg(r)}</b>`],h:v=>v==a**n?'Sin paréntesis el − no se eleva. (−a)² y −a² no son lo mismo.':0}},
()=>{const t=R(0,2),a=R(2,9),m=R(2,6),n=R(2,5),M=m+n,q=[`${SUP(a,m)} · ${SUP(a,n)} = ${a}<sup>?</sup>`,`${SUP(a,M)} : ${SUP(a,n)} = ${a}<sup>?</sup>`,`(${SUP(a,m)})<sup>${n}</sup> = ${a}<sup>?</sup>`][t],r=[M,m,m*n][t];
 return{k:'Propiedades de las potencias',q:q+'<br><small>escribe el exponente</small>',a:''+r,s:[['Misma base al multiplicar → <b>se suman</b> los exponentes',`${m} + ${n}`],['Misma base al dividir → <b>se restan</b> los exponentes',`${M} − ${n}`],['Potencia de una potencia → <b>se multiplican</b> los exponentes',`${m} · ${n}`]][t].concat(`Exponente: <b>${r}</b>`),h:v=>t==0&&v==m*n||t==2&&v==m+n?'Revisa: multiplicar potencias suma exponentes; potencia de potencia los multiplica.':0}}],
rai:[()=>{const k=R(4,25);return{k:'Raíz exacta',q:`√${k*k}`,a:''+k,s:[`Buscamos un número que elevado al cuadrado dé ${k*k}`,`${k} · ${k} = ${k*k} → <b>${k}</b>`]}},
()=>{const r=R(4,17),s=R(1,2*r),n=r*r+s;return{k:'Raíz entera y resto',pair:1,q:`Raíz entera y resto de ${n}<br><small>escribe: raíz  resto</small>`,a:r+' '+s,s:[`${r}² = ${r*r} ≤ ${n} < ${(r+1)**2} = ${r+1}²`,`Raíz entera: <b>${r}</b>`,`Resto = ${n} − ${r*r} = <b>${s}</b>`]}},
()=>{const r=R(3,15),s=R(0,2*r),n=r*r+s;return{k:'Buscar el número',q:`Un número tiene raíz entera ${r} y resto ${s}. ¿Cuál es?`,a:''+n,s:[`Número = raíz² + resto`,`${r}² + ${s} = ${r*r} + ${s} = <b>${n}</b>`],h:v=>v==r*r?'No olvides sumar el resto.':0}}]};
const mk=t=>{const g=P(G[t])();g.t=t;return g};
function judge(g,s){s=s.trim().replace(/−/g,'-').replace(',','.');
 if(g.pair){const m=s.match(/-?\d+/g);return m?{ok:m.join(' ')==g.a,u:m.join(' y ')}:{bad:1}}
 if(/^-?\d+\/-?\d+$/.test(s)){const[n,d]=s.split('/').map(Number);if(!d)return{bad:1};const c=cf(n,d);return{ok:c==g.a,v:n/d,part:c!=g.a&&A(n/d-eval(g.a))<1e-9,u:s}}
 if(/^-?\d+$/.test(s))return{ok:s==g.a,v:+s,u:s};return{bad:1}}
const show=g=>g.pair?g.a.replace(' ',' y resto '):g.a.includes('/')?F(...g.a.split('/')):g.a.replace('-','−');
const steps=g=>`<div class="st"><b>Paso a paso</b>${g.s.map(x=>`<p>${x}</p>`).join('')}<p class="ok">✅ Respuesta: ${show(g)}</p></div>`;
const chips=(c,fn,mix)=>`<div class="chips">${Object.entries(TOP).map(([k,[n,e]])=>`<button class="chip ${c==k?'on':''}" onclick="${fn}('${k}')">${e} ${n}</button>`).join('')}${mix?`<button class="chip ${c=='mix'?'on':''}" onclick="${fn}('mix')">🎲 Mezcla</button>`:''}</div>`;
const KB='<div class="kb">'+['−','/',' '].map(c=>`<button class="b g" onclick="ins('${c}')">${c==' '?'␣':c}</button>`).join('')+'</div>';
const ins=c=>{const i=$('#in');i.value+=c;i.focus()};
const W={};
W.ent=()=>{$('#wg').innerHTML=`<div class="card"><h3>🧪 Pruébalo en la recta</h3><p>a = <b id="va"></b> &nbsp; b = <b id="vb"></b></p><input type="range" id="ra" min="-10" max="10" value="3"><input type="range" id="rb" min="-10" max="10" value="-5"><div class="row"><button class="b g" id="op"></button></div><svg viewBox="0 0 340 90" id="sv"></svg><p class="q" id="tx"></p></div>`;
 let o=1;const x=v=>170+v*8,u=()=>{const a=+ra.value,b=+rb.value,r=a+o*b;va.textContent=sg(a);vb.textContent=sg(b);op.textContent='Operación: '+(o>0?'+':'−');let s='<line x1="10" x2="330" y1="50" y2="50" stroke="#aaa4d8"/>';for(let v=-20;v<=20;v+=5)s+=`<line x1="${x(v)}" x2="${x(v)}" y1="44" y2="56" stroke="#aaa4d8"/><text x="${x(v)}" y="74" fill="#aaa4d8" font-size="11" text-anchor="middle">${sg(v)}</text>`;
 sv.innerHTML=s+`<line x1="${x(a)}" x2="${x(r)}" y1="30" y2="30" stroke="#ffd45e" stroke-width="4"/><circle cx="${x(a)}" cy="50" r="7" fill="#ff4fa3"/><circle cx="${x(r)}" cy="50" r="7" fill="#37e8ae"/>`;tx.innerHTML=`${sg(a)} ${o>0?'+':'−'} ${pn(b)} = <span class="ok">${sg(r)}</span>`};
 ra.oninput=rb.oninput=u;op.onclick=()=>{o=-o;u()};u()};
W.fra=()=>{$('#wg').innerHTML=`<div class="card"><h3>🧪 Fracciones equivalentes</h3><p>Numerador <b id="va"></b> · Denominador <b id="vb"></b> · Multiplico por <b id="vk"></b></p><input type="range" id="ra" min="1" max="8" value="3"><input type="range" id="rb" min="2" max="8" value="4"><input type="range" id="rk" min="1" max="5" value="2"><div id="bx"></div><p class="q" id="tx"></p></div>`;
 const u=()=>{const b=+rb.value,a=Math.min(+ra.value,b),k=+rk.value,bar=(n,d)=>`<div style="display:flex;gap:3px;margin:8px 0">${Array.from({length:d},(_,i)=>`<span class="cell ${i<n?'on':''}"></span>`).join('')}</div>`;va.textContent=a;vb.textContent=b;vk.textContent=k;bx.innerHTML=bar(a,b)+bar(a*k,b*k);tx.innerHTML=`${F(a,b)} = ${F(a*k,b*k)}`};ra.oninput=rb.oninput=rk.oninput=u;u()};
W.pot=()=>{$('#wg').innerHTML=`<div class="card"><h3>🧪 Base y exponente</h3><p>Base <b id="va"></b> · Exponente <b id="vb"></b></p><input type="range" id="ra" min="-5" max="5" value="-2"><input type="range" id="rb" min="1" max="6" value="3"><p class="q" id="tx"></p><p id="t2"></p></div>`;
 const u=()=>{const a=+ra.value,e=+rb.value;va.textContent=sg(a);vb.textContent=e;tx.innerHTML=`${Array(e).fill(pn(a)).join(' · ')} = <span class="ok">${sg(a**e)}</span>`;t2.innerHTML=a<0?`Exponente ${e%2?'impar → resultado negativo':'par → resultado positivo'}.<br>⚠️ Sin paréntesis, −${A(a)}<sup>${e}</sup> = ${sg(-(A(a)**e))}`:a?'Con base positiva el resultado es siempre positivo.':'Con base 0 el resultado es 0.'};ra.oninput=rb.oninput=u;u()};
W.rai=()=>{$('#wg').innerHTML=`<div class="card"><h3>🧪 Cuadrados y restos</h3><p>Número n = <b id="va"></b></p><input type="range" id="ra" min="1" max="150" value="47"><div id="gd"></div><p class="q" id="tx"></p></div>`;
 const u=()=>{const n=+ra.value,r=Math.floor(Math.sqrt(n)),s=n-r*r;va.textContent=n;gd.innerHTML=`<div style="display:grid;grid-template-columns:repeat(${r},12px);gap:3px;justify-content:center">${'<i class="dt"></i>'.repeat(r*r)}</div><div style="display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin:8px auto 0;max-width:${r*15}px">${'<i class="dt x"></i>'.repeat(s)}</div>`;tx.innerHTML=`√${n} → raíz <b>${r}</b>, resto <b class="ko">${s}</b>${s?'':' · ¡cuadrado perfecto!'}`};ra.oninput=u;u()};
const TH={
ent:[`<h3>📏 Qué son</h3><p>Los enteros son los números con signo: …−2, −1, 0, 1, 2… El <b>valor absoluto</b> es la distancia al 0: |−5| = 5.</p><p>Sumar un positivo te mueve a la derecha; restar un positivo, a la izquierda.</p>`,`<h3>✖️ Signos</h3><p>En multiplicar y dividir: signos <b>iguales → +</b>, signos <b>distintos → −</b>.</p><p>Un <b>−</b> delante de un paréntesis cambia el signo de todo lo de dentro: 5 − (2 − 3) = 5 − 2 + 3.</p>`],
fra:[`<h3>🍕 Qué son</h3><p>${F(3,4)} = 4 partes iguales, coges 3. Son <b>equivalentes</b> si multiplicas o divides arriba y abajo por lo mismo.</p><p>Para sumar o restar necesitas el mismo denominador (m.c.m.). Para multiplicar: arriba con arriba, abajo con abajo. Para dividir: multiplica por la inversa.</p>`],
pot:[`<h3>⚡ Qué son</h3><p>${SUP('a','n')} es a multiplicado por sí mismo n veces. Base negativa: exponente <b>par → +</b>, <b>impar → −</b>.</p><p>Misma base: al multiplicar se <b>suman</b> exponentes, al dividir se <b>restan</b>, y en (aⁿ)ᵐ se <b>multiplican</b>.</p>`],
rai:[`<h3>🌱 Qué son</h3><p>√n es el número que, al cuadrado, da n. Si n no es cuadrado perfecto, hay <b>raíz entera r</b> y <b>resto = n − r²</b>.</p><p>El resto máximo es 2r: con uno más ya sería otro cuadrado.</p>`]};
let V=0,LT='ent',PT='ent',PR={},EX=null;
function go(v){V=v;$('#nv').innerHTML=['📖|Aprender','🎯|Practicar','📝|Examen','📊|Progreso'].map((x,i)=>{const[e,n]=x.split('|');return`<button class="${i==v?'on':''}" onclick="go(${i})"><b>${e}</b>${n}</button>`}).join('');
 if(v==1&&!PR.g)nq(1);$('#v').innerHTML=[lv,pv,ev,gv][v]();if(v==0)W[LT]();window.scrollTo(0,0)}
const sl=k=>{LT=k;go(0)};
const lv=()=>chips(LT,'sl')+TH[LT].map(x=>`<div class="card">${x}</div>`).join('')+'<div id="wg"></div>'+`<button class="b" style="width:100%" onclick="PT=LT;PR={};go(1)">Practicar ${TOP[LT][0]} →</button>`;
function nq(s){PR={g:mk(PT=='mix'?P(Object.keys(TOP)):PT)};if(!s)go(1)}
const sp=k=>{PT=k;PR={};go(1)};
const pv=()=>{const g=PR.g;return chips(PT,'sp',1)+`<div class="card"><small>${g.k}</small><div class="q">${g.q}</div><input type="text" id="in" autocomplete="off" autocapitalize="off" placeholder="${g.pair?'raíz  resto':'tu respuesta'}" onkeydown="if(event.key=='Enter')chk()">${KB}<div class="row"><button class="b" onclick="chk()">Comprobar</button></div><div id="fb"></div></div>`};
function chk(){const g=PR.g;if(PR.d)return;const j=judge(g,$('#in').value);let h;
 if(j.bad)h='<p class="ko">Escribe un número entero o una fracción como 3/4.</p>';
 else if(j.part)h='<p class="ko">Casi: el valor es correcto, pero falta <b>simplificar</b> la fracción.</p>';
 else{PR.d=1;rec(g,j.ok);h=(j.ok?'<h3 class="ok">¡Correcto! 🎉</h3>':`<h3 class="ko">Todavía no 🤔</h3><p>${g.h&&g.h(j.v)||'Compara tus pasos con los de abajo.'}</p>`)+steps(g)+'<div class="row"><button class="b" onclick="nq()">Otra →</button></div>'}
 $('#fb').innerHTML=h}
const ev=()=>{if(!EX)return`<div class="card"><h3>📝 Examen</h3><p>10 preguntas mezcladas. Sin ayudas: al final verás la nota, qué tema reforzar y el paso a paso de cada fallo.</p><button class="b" style="width:100%" onclick="sx()">Empezar</button></div>`;
 if(EX.i>=10)return res();const g=EX.qs[EX.i];return`<div class="card"><div class="bar"><i style="width:${EX.i*10}%"></i></div><small>Pregunta ${EX.i+1} de 10</small><div class="q">${g.q}</div><input type="text" id="in" autocomplete="off" autocapitalize="off" placeholder="${g.pair?'raíz  resto':'tu respuesta'}" onkeydown="if(event.key=='Enter')enx()">${KB}<div class="row"><button class="b" onclick="enx()">${EX.i==9?'Terminar':'Siguiente'}</button></div><div id="fb"></div></div>`};
function sx(){const q=[];Object.keys(TOP).forEach(t=>q.push(mk(t),mk(t)));q.push(mk(P(Object.keys(TOP))),mk(P(Object.keys(TOP))));EX={qs:q.sort(()=>Math.random()-.5),i:0,r:[]};go(2)}

 rec(g,j.ok);EX.r.push({g,ok:j.ok,u:j.u});EX.i++;go(2)}
function res(){const t=EX.r,sc=t.filter(x=>x.ok).length,by={};t.forEach(x=>{const b=by[x.g.t]=by[x.g.t]||[0,0];b[1]++;if(x.ok)b[0]++});
 if(!EX.s){EX.s=1;DB.ex.push({d:new Date().toLocaleDateString('es-ES',{day:'numeric',month:'short'}),s:sc});DB.ex=DB.ex.slice(-8);save()}
 const w=Object.entries(by).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1])[0][0],bad=t.filter(x=>!x.ok);

const gv=()=>{const tp=Object.entries(TOP).map(([k,[n,e]])=>{const s=DB.st[k]||{o:0,n:0},p=s.n?Math.round(s.o/s.n*100):0;return`<div>${e} ${n} <small>${s.o}/${s.n} aciertos</small><div class="bar"><i style="width:${p}%"></i></div></div>`}).join(''),er=Object.entries(DB.er).sort((a,b)=>b[1]-a[1]).slice(0,4);
 return`<div class="card"><h3>Tu progreso</h3>${tp}</div><div class="card"><h3>Dónde mejorar</h3>${er.length?er.map(([k,n])=>`<p>⚠️ ${k} <small>(${n} fallos)</small></p>`).join(''):'<p>Aún no hay fallos registrados. ¡Practica un poco!</p>'}</div><div class="card"><h3>Últimos exámenes</h3>${DB.ex.length?DB.ex.slice().reverse().map(x=>`<p>${x.d}: <b>${x.s}/10</b></p>`).join(''):'<p>Todavía no has hecho ninguno.</p>'}</div><button class="b g" style="width:100%" onclick="if(confirm('¿Borrar todo el progreso?')){DB={st:{},er:{},ex:[]};save();go(3)}">Borrar progreso</button>`};
go(0);
