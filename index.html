function judge(g,s){s=s.trim().replace(/−/g,'-').replace(',','.');
 if(g.pair){const m=s.match(/-?\d+/g);return m?{ok:m.join(' ')==g.a,u:m.join(' y ')}:{bad:1}}
 if(/^-?\d+\/-?\d+$/.test(s)){const[n,d]=s.split('/').map(Number);if(!d)return{bad:1};const c=cf(n,d);return{ok:c==g.a,v:n/d,part:c!=g.a&&A(n/d-eval(g.a))<1e-9,u:s}}
 if(/^-?\d+$/.test(s))return{ok:s==g.a,v:+s,u:s};return{bad:1}}
const show=g=>g.pair?g.a.replace(' ',' y resto '):g.a.includes('/')?F(...g.a.split('/')):g.a.replace('-','−');
const steps=g=>`<div class="st"><b>Paso a paso</b>${g.s.map(x=>`<p>${x}</p>`).join('')}<p class="ok">✅ Respuesta: ${show(g)}</p></div>`;
const chips=(c,fn,mix)=>`<div class="chips">${Object.entries(TOP).map(([k,[n,e]])=>`<button class="chip ${c==k?'on':''}" onclick="${fn}('${k}')">${e} ${n}</button>`).join('')}${mix?`<button class="chip ${c=='mix'?'on':''}" onclick="${fn}('mix')">🎲 Mezcla</button>`:''}</div>`;
const KB='<div class="kb">'+['−','/',' '].map(c=>`<button class="b g" onclick="ins('${c}')">${c==' '?'␣':c}</button>`).join('')+'</div>';
const ins=c=>{const i=$('#in');i.value+=c;i.focus()};
const W={};
W.ent=()=>{$('#wg').innerHTML=`<div class="card"><h3>🧪 Pruébalo en la recta</h3><p>a = <b id="va"></b> &nbsp; b = <b id="vb"></b></p><input type="range" id="ra" min="-10" max="10" value="3"><input type="range" id="rb" min="-10" max="10" value="-5"><div class="row"><button class="b g" id="op"></button></div><svg viewBox="0 0 340 90" id="sv"></svg><p class="q" id="tx"></p></div>`;
 let o=1;const x=v=>170+v*8,u=()=>{const a=+ra.value,b=+rb.value,r=a+o*b;va.textContent=sg(a);vb.textContent=sg(b);op.textContent='Operación: '+(o>0?'+':'−');let s='<line x1="10" x2="330" y1="50" y2="50" stroke="#aaa4d8"/>';for(let v=-20;v<=20;v+=5)s+=`<line x1="${x(v)}" x2="${x(v)}" y1="44" y2="56" stroke="#aaa4d8"/><text x="${x(v)}" y="74" fill="#aaa4d8" font-size="11" text-anchor="middle">${sg(v)}</text>`;
 sv.innerHTML=s+`<line x1="${x(a)}" x2="${x(r)}" y1="30" y2="30" stroke="#ffd45e" stroke-width="4"/><circle cx="${x(a)}" cy="50" r="7" fill="#ff4fa3"/><circle cx="${x(r)}" cy="50" r="7" fill="#37e8ae"/>`;tx.innerHTML=`${sg(a)} ${o>0?'+':'−'} ${pn(b)} = <span class="ok">${sg(r)}</span>`};
 ra.oninput=rb.oninput=u;op.onclick=()=>{o=-o;u()};u()};
W.fra=()=>{$('#wg').innerHTML=`<div class="card"><h3>🧪 Fracciones equivalentes</h3><p>Numerador <b id="va"></b> · Denominador <b id="vb"></b> · Multiplico por <b id="vk"></b></p><input type="range" id="ra" min="1" max="8" value="3"><input type="range" id="rb" min="2" max="8" value="4"><input type="range" id="rk" min="1" max="5" value="2"><div id="bx"></div><p class="q" id="tx"></p></div>`;
 const u=()=>{const b=+rb.value,a=Math.min(+ra.value,b),k=+rk.value,bar=(n,d)=>`<div style="display:flex;gap:3px;margin:8px 0">${Array.from({length:d},(_,i)=>`<span class="cell ${i<n?'on':''}"></span>`).join('')}</div>`;va.textContent=a;vb.textContent=b;vk.textContent=k;bx.innerHTML=bar(a,b)+bar(a*k,b*k);tx.innerHTML=`${F(a,b)} = ${F(a*k,b*k)}`};ra.oninput=rb.oninput=rk.oninput=u;u()};
W.pot=()=>{$('#wg').innerHTML=`<div class="card"><h3>🧪 Base y exponente</h3><p>Base <b id="va"></b> · Exponente <b id="vb"></b></p><input type="range" id="ra" min="-5" max="5" value="-2"><input type="range" id="rb" min="1" max="6" value="3"><p class="q" id="tx"></p><p id="t2"></p></div>`;
 const u=()=>{const a=+ra.value,e=+rb.value;va.textContent=sg(a);vb.textContent=e;tx.innerHTML=`${Array(e).fill(pn(a)).join(' · ')} = <span class="ok">${sg(a**e)}</span>`;t2.innerHTML=a<0?`Exponente ${e%2?'impar → resultado negativo':'par → resultado positivo'}.<br>⚠️ Sin paréntesis, −${A(a)}<sup>${e}</sup> = ${sg(-(A(a)**e))}`:a?'Con base positiva el resultado es siempre positivo.':'Con base 0 el resultado es 0.'};ra.oninput=rb.oninput=u;u()};
W.rai=()=>{$('#wg').innerHTML=`<div class="card"><h3>🧪 Cuadrados y restos</h3><p>Número n = <b id="va"></b></p><input type="range" id="ra" min="1" max="150" value="47"><div id="gd"></div><p class="q" id="tx"></p></div>`;
 const u=()=>{const n=+ra.value,r=Math.floor(Math.sqrt(n)),s=n-r*r;va.textContent=n;gd.innerHTML=`<div style="display:grid;grid-template-columns:repeat(${r},12px);gap:3px;justify-content:center">${'<i class="dt"></i>'.repeat(r*r)}</div><div style="display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin:8px auto 0;max-width:${r*15}px">${'<i class="dt x"></i>'.repeat(s)}</div>`;tx.innerHTML=`√${n} → raíz <b>${r}</b>, resto <b class="ko">${s}</b>${s?'':' · ¡cuadrado perfecto!'}`};ra.oninput=u;u()};
const TH={
ent:[`<h3>📏 Qué son</h3><p>Los enteros son los números con signo: …−2, −1, 0, 1, 2… El <b>valor absoluto</b> es la distancia al 0: |−5| = 5.</p><p>Sumar un positivo te mueve a la derecha; restar un positivo, a la izquierda.</p>`,`<h3>✖️ Signos</h3><p>En multiplicar y dividir: signos <b>iguales → +</b>, signos <b>distintos → −</b>.</p><p>Un <b>−</b> delante de un paréntesis cambia el signo de todo lo de dentro: 5 − (2 − 3) = 5 − 2 + 3.</p>`],
fra:[`<h3>🍕 Qué son</h3><p>${F(3,4)} = 4 partes iguales, coges 3. Son <b>equivalentes</b> si multiplicas o divides arriba y abajo por lo mismo.</p><p>Para sumar o restar necesitas el mismo denominador (m.c.m.). Para multiplicar: arriba con arriba, abajo con abajo. Para dividir: multiplica por la inversa.</p>`],
pot:[`<h3>⚡ Qué son</h3><p>${SUP('a','n')} es a multiplicado por sí mismo n veces. Base negativa: exponente <b>par → +</b>, <b>impar → −</b>.</p><p>Misma base: al multiplicar se <b>suman</b> exponentes, al dividir se <b>restan</b>, y en (aⁿ)ᵐ se <b>multiplican</b>.</p>`],
rai:[`<h3>🌱 Qué son</h3><p>√n es el número que, al cuadrado, da n. Si n no es cuadrado perfecto, hay <b>raíz entera r</b> y <b>resto = n − r²</b>.</p><p>El resto máximo es 2r: con uno más ya sería otro cuadrado.</p>`]};
let V=0,LT='ent',PS=['ent'],PR={},EX=null,RP=0;
function go(v){V=v;$('#nv').innerHTML=['📖|Aprender','🎯|Practicar','📝|Examen','📊|Progreso'].map((x,i)=>{const[e,n]=x.split('|');return`<button class="${i==v?'on':''}" onclick="go(${i})"><b>${e}</b>${n}</button>`}).join('');
 if(v==1&&!PR.g)nq(1);$('#v').innerHTML=[lv,pv,ev,gv][v]();if(v==0)W[LT]();window.scrollTo(0,0)}
const sl=k=>{LT=k;go(0)};
const lv=()=>chips(LT,'sl')+TH[LT].map(x=>`<div class="card">${x}</div>`).join('')+'<div id="wg"></div>'+`<button class="b" style="width:100%" onclick="PS=[LT];PR={};go(1)">Practicar ${TOP[LT][0]} →</button>`;
function nq(s){PR={g:RP?rq():mk(P(PS))};if(!s)go(1)}
const rq=()=>{const e=Object.entries(DB.er).filter(x=>DB.et&&DB.et[x[0]]);if(!e.length){RP=0;return mk(P(PS))}let r=Math.random()*e.reduce((a,x)=>a+x[1],0),k=e[0][0];for(const x of e){if((r-=x[1])<0){k=x[0];break}}const t=DB.et[k],pb=k.startsWith('Problema')?1:0;for(let i=0;i<80;i++){const g=mk(t,pb);if(g.k==k)return g}return mk(t,pb)};const tog=k=>{RP=0;PS=k=='all'?Object.keys(TOP):PS.includes(k)?(PS.length>1?PS.filter(x=>x!=k):PS):PS.concat(k)},sp=k=>{tog(k);PR={};go(1)},se=k=>{tog(k);go(2)},sd=i=>{DF=i;DB.df=i;save();PR={};go(V)},sk=i=>{KT=i;PR={};go(1)},opt=(a,c,f)=>`<div class="chips">${a.map((x,i)=>`<button class="chip ${c==i?'on':''}" onclick="${f}(${i})">${x}</button>`).join('')}</div>`,mch=(S,f)=>`<div class="chips">${Object.entries(TOP).map(([k,[n,e]])=>`<button class="chip ${S.includes(k)?'on':''}" onclick="${f}('${k}')">${e} ${n}</button>`).join('')}<button class="chip" onclick="${f}('all')">🎲 Todas</button></div>`,LVL=['🟢 Bajo','🟡 Medio','🔴 Alto'];
const pv=()=>{const g=PR.g;return mch(PS,'sp')+'<small>Toca varios temas para mezclarlos</small>'+opt(LVL,DF,'sd')+opt(['✏️ Ejercicios','📖 Problemas'],KT,'sk')+(RP?'<p class="ko"><b>🔁 Repaso de errores</b>: te pongo los tipos que más fallas. Toca un tema para salir.</p>':(Object.keys(DB.er).length?'<button class="chip" onclick="RP=1;PR={};go(1)">🔁 Repasar mis errores</button>':''))+`<div class="card"><small>${g.k}</small><div class="q">${g.q}</div><input type="text" id="in" autocomplete="off" autocapitalize="off" placeholder="${g.pair?'raíz  resto':'tu respuesta'}" onkeydown="if(event.key=='Enter')chk()">${KB}<div class="row"><button class="b" onclick="chk()">Comprobar</button></div><div id="fb"></div></div>`};
function chk(){const g=PR.g;if(PR.d)return;const j=judge(g,$('#in').value);let h;
 if(j.bad)h='<p class="ko">Escribe un número entero o una fracción como 3/4.</p>';
 else if(j.part)h='<p class="ko">Casi: el valor es correcto, pero falta <b>simplificar</b> la fracción.</p>';
 else{PR.d=1;rec(g,j.ok);h=(j.ok?'<h3 class="ok">¡Correcto! 🎉</h3>':`<h3 class="ko">Todavía no 🤔</h3><p>${g.h&&g.h(j.v)||'Compara tus pasos con los de abajo.'}</p>`)+steps(g)+'<div class="row"><button class="b" onclick="nq()">Otra →</button></div>'}
 $('#fb').innerHTML=h}
const ev=()=>{if(!EX)return`<div class="card"><h3>📝 Examen</h3>${mch(PS,'se')}${opt(LVL,DF,'sd')}<p>10 preguntas con ejercicios y problemas de los temas elegidos. Sin ayudas: al final verás la nota, qué tema reforzar y el paso a paso de cada fallo.</p><button class="b" style="width:100%" onclick="sx()">Empezar</button></div>`;
 if(EX.i>=10)return res();const g=EX.qs[EX.i];return`<div class="card"><div class="bar"><i style="width:${EX.i*10}%"></i></div><small>Pregunta ${EX.i+1} de 10</small><div class="q">${g.q}</div><input type="text" id="in" autocomplete="off" autocapitalize="off" placeholder="${g.pair?'raíz  resto':'tu respuesta'}" onkeydown="if(event.key=='Enter')enx()">${KB}<div class="row"><button class="b" onclick="enx()">${EX.i==9?'Terminar':'Siguiente'}</button></div><div id="fb"></div></div>`};
function sx(){RP=0;const q=[];for(let i=0;i<10;i++)q.push(mk(PS[i%PS.length],Math.random()<.3?1:0));EX={qs:q.sort(()=>Math.random()-.5),i:0,r:[]};go(2)}
function enx(){const g=EX.qs[EX.i],j=judge(g,$('#in').value);if(j.bad){$('#fb').innerHTML='<p class="ko">Escribe un número o una fracción como 3/4.</p>';return}
 rec(g,j.ok);EX.r.push({g,ok:j.ok,u:j.u});EX.i++;go(2)}
function res(){const t=EX.r,sc=t.filter(x=>x.ok).length,by={};t.forEach(x=>{const b=by[x.g.t]=by[x.g.t]||[0,0];b[1]++;if(x.ok)b[0]++});
 if(!EX.s){EX.s=1;DB.ex.push({d:new Date().toLocaleDateString('es-ES',{day:'numeric',month:'short'}),s:sc});DB.ex=DB.ex.slice(-8);save()}
 const w=Object.entries(by).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1])[0][0],bad=t.filter(x=>!x.ok);
 return`<div class="card"><h2>${sc}/10 ${sc>9?'🏆':sc>6?'💪':sc>4?'🙂':'📚'}</h2>`+Object.entries(by).map(([k,[o,n]])=>`<div>${TOP[k][1]} ${TOP[k][0]}: ${o}/${n}<div class="bar"><i style="width:${o/n*100}%"></i></div></div>`).join('')+(sc<10?`<p>🎯 A reforzar: <b>${TOP[w][0]}</b></p><button class="b" onclick="LT='${w}';go(0)">Repasar teoría</button>`:'<p class="ok">¡Dominas todo!</p>')+`<div class="row"><button class="b g" onclick="EX=null;go(2)">Otro examen</button>${bad.length?'<button class="b" onclick="RP=1;PR={};go(1)">🔁 Repasar errores</button>':''}</div></div>`+(bad.length?'<h3>Revisa tus fallos</h3>':'')+bad.map(x=>`<details class="card"><summary>${x.g.k}: ${x.g.q.split('<br>')[0]}</summary><p class="ko">Tu respuesta: ${x.u.replace('-','−')}</p>${steps(x.g)}</details>`).join('')}
const gv=()=>{const tp=Object.entries(TOP).map(([k,[n,e]])=>{const s=DB.st[k]||{o:0,n:0},p=s.n?Math.round(s.o/s.n*100):0;return`<div>${e} ${n} <small>${s.o}/${s.n} aciertos</small><div class="bar"><i style="width:${p}%"></i></div></div>`}).join(''),er=Object.entries(DB.er).sort((a,b)=>b[1]-a[1]).slice(0,4);
 return`<div class="card"><h3>Tu progreso</h3>${tp}</div><div class="card"><h3>Dónde mejorar</h3>${er.length?er.map(([k,n])=>`<p>⚠️ ${k} <small>(${n} fallos)</small></p>`).join(''):'<p>Aún no hay fallos registrados. ¡Practica un poco!</p>'}${er.length?'<button class="b" style="width:100%" onclick="RP=1;PR={};go(1)">🔁 Repasar mis errores</button>':''}</div><div class="card"><h3>Últimos exámenes</h3>${DB.ex.length?DB.ex.slice().reverse().map(x=>`<p>${x.d}: <b>${x.s}/10</b></p>`).join(''):'<p>Todavía no has hecho ninguno.</p>'}</div><button class="b g" style="width:100%" onclick="if(confirm('¿Borrar todo el progreso?')){DB={st:{},er:{},ex:[]};save();go(3)}">Borrar progreso</button>`};
go(0);
</script></body></html>
